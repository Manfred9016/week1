<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Horizons - Interactive Learning Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Cyberpunk / AI Neon Theme */
            --bg-dark: #080811;
            --panel-bg: #121222;
            --neon-blue: #00f3ff;
            --neon-purple: #9d00ff;
            --neon-pink: #ff00ea;
            --neon-green: #39ff14;
            --neon-red: #ff073a;
            --text-main: #ffffff;
            --text-muted: #9fa8b6;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background-image: 
              radial-gradient(circle at 15% 40%, rgba(0, 243, 255, 0.08), transparent 30%),
              radial-gradient(circle at 85% 60%, rgba(157, 0, 255, 0.08), transparent 30%);
        }

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .header-banner {
            background-color: rgba(8, 8, 17, 0.95);
            border-bottom: 2px solid var(--neon-purple);
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 25px rgba(157, 0, 255, 0.3);
            z-index: 10;
        }

        .header-banner h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-purple);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        #app-container {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .level-card {
            background: var(--panel-bg);
            border: 2px solid #282845;
            border-radius: var(--radius-lg);
            padding: 2.2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .level-card:hover {
            transform: scale(1.03) translateY(-4px);
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.35), inset 0 0 10px rgba(0, 243, 255, 0.15);
        }

        .level-card h2, .level-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            margin-top: 1rem;
            text-transform: uppercase;
        }

        .level-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--neon-purple);
            background-color: rgba(0, 0, 0, 0.4);
        }

        .action-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 14px;
            background: rgba(18, 18, 34, 0.9);
            border: 2px solid #3d3d63;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            color: white;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-top: 1rem;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .action-btn:hover:not(:disabled) {
            border-color: var(--neon-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.3);
            color: var(--neon-blue);
        }
        
        .action-btn:hover:not(:disabled)::before { left: 100%; }
        .action-btn:active:not(:disabled) { transform: translateY(1px); }

        .btn-correct { background-color: rgba(57, 255, 20, 0.2) !important; border-color: var(--neon-green) !important; box-shadow: 0 0 15px var(--neon-green) !important; color: var(--neon-green) !important; }
        .btn-wrong { background-color: rgba(255, 7, 58, 0.2) !important; border-color: var(--neon-red) !important; box-shadow: 0 0 15px var(--neon-red) !important; color: var(--neon-red) !important; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 2rem;
        }

        @media (max-width: 600px) {
            .nav-buttons { flex-direction: column; }
            .nav-buttons .action-btn { width: 100% !important; margin-top: 0; }

            border-radius: var(--radius-lg);
            border: 2px solid #282845;
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);

        .reading-container h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 8px;
            border: 1px solid var(--neon-blue);
        }

        .cloud-word {
            background: var(--bg-dark);
            color: var(--neon-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border: 1px solid var(--neon-blue);
            transition: all 0.3s;
        }

        .cloud-word.found {
            background: rgba(57, 255, 20, 0.2);
            color: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            text-decoration: line-through;
        }

        .interactive-word {
            cursor: pointer;
            padding: 0 2px;
            border-bottom: 1px dashed var(--neon-blue);
            transition: background 0.2s;
        }

        .interactive-word.revealed {
            background: var(--neon-blue);
            color: #000;
            font-weight: bold;
        }

        hr { border: 0; height: 1px; background: #2f2f4d; margin: 1.8rem 0; }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid #3d3d63;
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--neon-blue);
            margin-top: 1rem;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .flashcard-scene {
            width: 100%;
            height: 280px;
            perspective: 1000px;
            margin: 1.8rem 0;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--neon-purple);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.2);
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: var(--neon-pink);
            padding: 1.5rem;
            text-align: center;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: var(--bg-dark);
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .sentence-dropzone, .word-bank {
            min-height: 80px;
            border: 2px dashed #3d3d63;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-dark);
        }
        .draggable-word {
            padding: 10px 14px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            transition: transform 0.1s;
            user-select: none;
        }
        .draggable-word:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .ai-logo-frame {
            width: 180px;
            height: 180px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 20px;
            padding: 15px;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            margin: 0 auto 1.5rem auto;
            display: block;
        }

        @keyframes popIn {
            0% { transform: scale(0.96); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.3s ease-out forwards; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>

        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['#00f3ff', '#9d00ff', '#ff00ea', '#39ff14'];

            for (let i = 0; i < 45; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedY: Math.random() * 0.8 - 0.4,
                    speedX: Math.random() * 0.8 - 0.4,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particlesArray.length; i++) {
                    let p = particlesArray[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        function scrambleString(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join('');
            if (scrambled === str && str.length > 3) return scrambleString(str);
            return scrambled;
        }

                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem;">
                        <span>Sentence ${currentSentenceIndex + 1} of ${sentencesList.length}</span>
                    </div>
                    <h2 style="margin-top:0;">Construct the Key Insight</h2>
                    <p style="color:var(--text-muted);">Click tokens in sequence to assemble the sentence.</p>
                    
                    <div id="sentence-answer-zone" class="sentence-dropzone"></div>
                    <div id="sentence-word-bank" class="word-bank">${wordsHTML}</div>
                    
                    <button class="action-btn" onclick="checkSentenceUnscramble('${sentence.replace(/'/g, "\\'")}')">Validate Sentence</button>
                </div>
            `;
        }

        function moveWordOnClick(element) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const wordBank = document.getElementById('sentence-word-bank');
            
            if (element.parentNode.id === 'sentence-word-bank') {
                answerZone.appendChild(element);
            } else {
                wordBank.appendChild(element);
            }
        }

        function checkSentenceUnscramble(correctSentence) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const currentWords = Array.from(answerZone.children).map(el => el.innerText);
            const userSentence = currentWords.join(' ');
            
            if (userSentence === correctSentence) {
                answerZone.style.borderColor = 'var(--neon-green)';
                answerZone.style.boxShadow = '0 0 15px var(--neon-green) inset';
                updateXP(25);
                setTimeout(() => {
                    currentSentenceIndex++;
                    if (currentSentenceIndex >= currentLevel.sentences.length) {
                        alert("Sentence Builder Complete! (+50 XP Bonus)");
                        updateXP(50);
                        renderMenu();
                    } else {
                        renderSentenceUnscramble();
                    }
                }, 1200);
            } else {
                answerZone.style.borderColor = 'var(--neon-red)';
                answerZone.classList.add('shake');
                setTimeout(() => answerZone.classList.remove('shake'), 400);
            }
        }

        // --- ACTIVITY 7: GUESS THE AI (LOGO CHALLENGE) ---
        function startAIChallenge() {
            aiChallengeIndex = 0;
            activeAIs = [...aiDB].sort(() => 0.5 - Math.random());
            renderAIChallenge();
        }

        function renderAIChallenge() {
            if (aiChallengeIndex >= activeAIs.length) {
                alert("AI Recon Completed! You recognized every top artificial intelligence platform.");
                return renderMenu();
            }

            const currentAI = activeAIs[aiChallengeIndex];
            
            let options = [currentAI.name];
            let pool = ALL_AIS.filter(name => name !== currentAI.name);
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random()); 

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem;">
                        <span>AI Recognition ${aiChallengeIndex + 1} of ${activeAIs.length}</span>
                    </div>

                    <div style="background: rgba(0, 243, 255, 0.05); padding: 0.8rem; border-radius: 8px; margin-bottom: 1.5rem; border-left: 4px solid var(--neon-blue); text-align: center;">
                        <span style="color: var(--neon-blue); font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight:bold;">Category: ${currentAI.category}</span>
                    </div>

                    <div id="ai-feedback-zone">
                        <img src="${currentAI.img}" alt="AI Logo" class="ai-logo-frame" onerror="this.src='https://placehold.co/200x200/ffffff/121222?text=AI+LOGO'">
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">Which AI platform or model is this?</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.8rem; font-size: 0.95rem; line-height: 1.3;" onclick="checkAIGuess(this, '${opt}', '${currentAI.name}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAIGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                setTimeout(() => {
                    aiChallengeIndex++;
                    renderAIChallenge();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                const feedbackZone = document.getElementById('ai-feedback-zone');
                feedbackZone.innerHTML = `
                    <div style="color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-size: 1.3rem; font-weight: bold; margin: 2rem 0; text-transform: uppercase; font-family: 'Orbitron', sans-serif;">
                        Incorrect! This logo belongs to ${correct}.
                    </div>`;
                setTimeout(() => {
                    aiChallengeIndex++;
                    renderAIChallenge(); 
                }, 2200);
            }
        }

        // --- ACTIVITY 8: EMOJI AI GUESS CHALLENGE ---
        function startAppChallenge() {
            appChallengeIndex = 0;
            activeAIApps = [...aiAppsDB].sort(() => 0.5 - Math.random());
            renderAppChallenge();
        }

        function renderAppChallenge() {
            if (appChallengeIndex >= activeAIApps.length) {
                alert("Emoji AI Challenge Complete! You've decoded real-world AI applications.");
                return renderMenu();
            }

            const currentApp = activeAIApps[appChallengeIndex];
            
            let options = [currentApp.name];
            let pool = ALL_AI_APPS.filter(n => n !== currentApp.name);
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random()); 

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem;">
                        <span>Emoji Concept ${appChallengeIndex + 1} of ${activeAIApps.length}</span>
                    </div>

                    <div id="app-feedback-zone" style="min-height: 200px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5); border: 3px solid var(--neon-pink); border-radius: 12px; margin-bottom: 1.8rem; box-shadow: 0 0 20px rgba(255,0,234,0.3);">
                        <span style="font-size: 4.5rem; text-shadow: 0 0 25px rgba(255, 0, 234, 0.8); user-select: none;">${currentApp.emoji}</span>
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">Which AI capability is represented by these emojis?</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.6rem; font-size: 0.95rem; line-height: 1.3;" onclick="checkAppGuess(this, '${opt}', '${currentApp.name}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAppGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                const feedbackZone = document.getElementById('app-feedback-zone');
                feedbackZone.innerHTML = `
                    <span style="display: block; color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-size: 1.2rem; font-weight: bold; margin: 1.5rem 0; text-transform: uppercase; font-family: 'Orbitron', sans-serif;">
                        Incorrect! Represents: ${correct}.
                    </span>`;
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge(); 
                }, 2200);
            }
        }

        // --- ACTIVITY 9: SYNONYM MATCH CHALLENGE ---
        function startSynonymMatch() {
            if (!currentLevel.synonyms || currentLevel.synonyms.length === 0) {
                alert("No synonyms available for this level.");
                return;
            }
            synonymChallengeIndex = 0;
            activeSynonyms = [...currentLevel.synonyms].sort(() => 0.5 - Math.random());
            renderSynonymMatch();
        }

        function renderSynonymMatch() {
            if (synonymChallengeIndex >= activeSynonyms.length) {
                alert("Synonym Master! Challenge Complete. (+50 XP Bonus)");
                updateXP(50);
                return renderMenu();
            }

            const currentPair = activeSynonyms[synonymChallengeIndex];
            
            let options = [currentPair.synonym];
            let pool = currentLevel.synonyms
                .map(s => s.synonym)
                .filter(syn => syn !== currentPair.synonym);
            
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem;">
                        <span>Synonym Pair ${synonymChallengeIndex + 1} of ${activeSynonyms.length}</span>
                    </div>

                    <h2 style="color: #fff; margin-bottom: 0.5rem;">Find the closest synonym for:</h2>
                    
                    <div style="background: rgba(157, 0, 255, 0.08); padding: 1.8rem; border-radius: 8px; margin-bottom: 2rem; border: 2px dashed var(--neon-purple); text-align: center;">
                        <strong style="color: var(--neon-pink); text-shadow: 0 0 15px rgba(255,0,234,0.5); font-family: 'Orbitron', sans-serif; font-size: 2.2rem; letter-spacing: 2px; text-transform: uppercase;">
                            ${currentPair.word}
                        </strong>
                    </div>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.2rem; font-size: 1.05rem;" onclick="checkSynonymGuess(this, '${opt}', '${currentPair.synonym}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkSynonymGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(15);
                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                btn.classList.add('shake');
                
                allButtons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('btn-correct');
                    }
                });

                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch(); 
                }, 2000);
            }
        }

        // Initialize application on load
        init();
    </script>
</body>
</html>
